name: ai-teacher-education-knowledge

services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
      - qdrant-snapshots:/qdrant/snapshots

  neo4j:
    image: neo4j:2026.07.1-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:?Copy .env.example to .env and set NEO4J_AUTH}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - neo4j-import:/import

volumes:
  qdrant-data:
  qdrant-snapshots:
  neo4j-data:
  neo4j-logs:
  neo4j-import:
