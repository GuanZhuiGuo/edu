<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">勾股定理直角三角形示意图</title>
  <desc id="desc">两条直角边分别标记为 a 和 b，斜边标记为 c，并显示 a 平方加 b 平方等于 c 平方。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef6ff"/>
      <stop offset="1" stop-color="#f8fbff"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4b7bec" stop-opacity=".28"/>
      <stop offset="1" stop-color="#67c7ba" stop-opacity=".18"/>
    </linearGradient>
  </defs>
  <rect width="760" height="420" rx="28" fill="url(#bg)"/>
  <g transform="translate(88 52)">
    <path d="M64 288 L64 50 L424 288 Z" fill="url(#fill)" stroke="#2d64d8" stroke-width="8" stroke-linejoin="round"/>
    <path d="M64 254 H98 V288" fill="none" stroke="#2d64d8" stroke-width="6"/>
    <circle cx="64" cy="288" r="7" fill="#2d64d8"/>
    <text x="22" y="180" fill="#26384f" font-family="system-ui, sans-serif" font-size="36" font-weight="700">a</text>
    <text x="232" y="334" fill="#26384f" font-family="system-ui, sans-serif" font-size="36" font-weight="700">b</text>
    <text x="255" y="146" fill="#26384f" font-family="system-ui, sans-serif" font-size="36" font-weight="700" transform="rotate(34 255 146)">c</text>
  </g>
  <g transform="translate(510 122)">
    <rect width="192" height="138" rx="22" fill="#ffffff" stroke="#d8e4f2" stroke-width="2"/>
    <text x="96" y="62" text-anchor="middle" fill="#1f3760" font-family="system-ui, sans-serif" font-size="30" font-weight="750">a² + b²</text>
    <text x="96" y="104" text-anchor="middle" fill="#2d64d8" font-family="system-ui, sans-serif" font-size="34" font-weight="800">= c²</text>
  </g>
</svg>
